[package]
name        = "cad"
description = "NAND Flash Translation Layer"
authors     = ["Dmitry Ponyatov <dponyatov@gmail.com>"]
repository  = "https://github.com/dponyatov/FTL"
license     = "MIT"
keywords    = ["cad"]
categories  = ["mobile", "cad"]
version     = "0.0.1"
edition     = "2021"

[dependencies]
config = { path = "config" }
log = "0.4.22"
env_logger = "0.11.5"

[workspace]
members = ["config", "server"]

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
sdl2 = "0.37.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"

[features]
default = ["gui"]
gui = []
wasm = []
